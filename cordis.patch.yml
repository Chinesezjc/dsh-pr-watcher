# dsh-pr-watcher bundle patch: mount the host watcher service, the
# model-facing tools, and the companion skill. Watches are configured per
# deployment in the profile overlay (Config.watches) or registered at runtime
# through pr_watch; no watch or repository name is baked into the bundle.
- insert:
    - id: pr-watcher
      name: dsh-pr-watcher/pr-watcher
      config:
        pollIntervalMs: 60000
        ghPath: gh
        delivery: inject
        allowResume: false
        notifySessionId: ""

    - id: tool-pr-watcher
      name: dsh-pr-watcher/tool-pr-watcher

    - id: skill-pr-watcher
      name: dsh-pr-watcher/skill-pr-watcher
