# dsh-pr-watcher bundle patch: mount the host watcher service, the
# model-facing tools, and the companion skill. Watches are configured per
# deployment in the profile overlay (Config.watches) or registered at runtime
# through pr_watch; no watch or repository name is baked into the bundle.
# delivery: steer cuts the notification into the nearest step boundary of the
# target session (an idle session is woken into a turn); allowResume lets a
# fully unloaded (persisted) session be woken too. Both are opt-out: pass
# followup to queue behind current work and inject for silent context
# seeding, and set allowResume: false to forbid waking.
- insert:
    - id: pr-watcher
      name: dsh-pr-watcher/pr-watcher
      config:
        pollIntervalMs: 60000
        ghPath: gh
        delivery: steer
        allowResume: true
        notifySessionId: ""

    - id: tool-pr-watcher
      name: dsh-pr-watcher/tool-pr-watcher

    - id: skill-pr-watcher
      name: dsh-pr-watcher/skill-pr-watcher
